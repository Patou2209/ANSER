    <!-- =========================================================
         HERO SLIDER

         IMPORTANT :
         Remplace simplement les valeurs de "image" dans le JS
         par tes propres images.
    ========================================================== -->

    <section class="hero" aria-label="Présentation">

        <!-- Les slides seront générées automatiquement par JavaScript -->
        <div id="slidesContainer"></div>

        <!-- Navigation -->
        <div class="hero-nav">

            <div class="arrows">
                <button
                    class="arrow"
                    id="prevBtn"
                    aria-label="Slide précédente">
                    ←
                </button>

                <button
                    class="arrow"
                    id="nextBtn"
                    aria-label="Slide suivante">
                    →
                </button>
            </div>

            <div
                class="dots"
                id="dotsContainer"
                aria-label="Navigation des slides">
            </div>

        </div>

        <!-- Barre de progression -->
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
